<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김현주 | 안전 관리자</title>
  <meta name="description" content="김현주 - 해성기공 안전 관리자의 디지털 명함" />
  <style>
    /* ===== 테마 변수 ===== */
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --text: #1a1d29;
      --muted: #646b80;
      --line: #e4e6ee;
      --chip: #f3f4f8;
      --chip-hover: #e9ebf3;
      --primary: #ea580c;
      --primary-2: #1e3a8a;
      --primary-text: #ffffff;
      --bg-from: #ffffff;
      --bg-to: #dbeafe;
      --shadow:
        0 1px 2px rgba(15, 23, 42, 0.04),
        0 8px 24px rgba(15, 23, 42, 0.06),
        0 24px 60px -12px rgba(30, 58, 138, 0.18);
      --btn-hover-shadow: 0 12px 28px -10px rgba(234, 88, 12, 0.55);
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --bg: #0e1016;
      --card: #171a23;
      --text: #eef0f6;
      --muted: #9aa1b5;
      --line: #262a37;
      --chip: #1f2330;
      --chip-hover: #282d3d;
      --primary: #fb923c;
      --primary-2: #1e40af;
      --primary-text: #ffffff;
      --bg-from: #0f1a3d;
      --bg-to: #000000;
      --shadow:
        0 1px 2px rgba(0, 0, 0, 0.3),
        0 12px 32px rgba(0, 0, 0, 0.4),
        0 30px 70px -20px rgba(59, 130, 246, 0.18);
      --btn-hover-shadow: 0 12px 28px -10px rgba(251, 146, 60, 0.5);
      color-scheme: dark;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1016;
        --card: #171a23;
        --text: #eef0f6;
        --muted: #9aa1b5;
        --line: #262a37;
        --chip: #1f2330;
        --chip-hover: #282d3d;
        --primary: #fb923c;
        --primary-2: #1e40af;
        --primary-text: #ffffff;
        --bg-from: #0f1a3d;
        --bg-to: #000000;
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.3),
          0 12px 32px rgba(0, 0, 0, 0.4),
          0 30px 70px -20px rgba(59, 130, 246, 0.18);
        --btn-hover-shadow: 0 12px 28px -10px rgba(251, 146, 60, 0.5);
        color-scheme: dark;
      }
    }

    /* ===== 기본 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 16px 32px;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      /* 은은한 배경 그라데이션 (라이트: 흰색→연한 파랑 / 다크: 남색→검정) */
      background: linear-gradient(160deg, var(--bg-from) 0%, var(--bg-to) 100%) fixed;
      background-color: var(--bg-to);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s, color 0.3s;
    }

    svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    svg.fill { fill: currentColor; stroke: none; }

    a { color: inherit; text-decoration: none; }

    /* ===== 테마 토글 ===== */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s, background-color 0.3s;
      z-index: 10;
    }
    .theme-toggle:hover { transform: rotate(20deg) scale(1.05); }
    .theme-toggle .icon-moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .icon-sun { display: none; }
      :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: block; }
    }

    /* ===== 카드 ===== */
    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 0 28px 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      text-align: center;
      overflow: hidden;
      animation: rise 0.6s ease-out both;
      transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .card-banner {
      position: relative;
      height: 110px;
      margin: 0 -28px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
    }
    /* 하단 안전 스트라이프 */
    .card-banner .stripe {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 10px;
      background: repeating-linear-gradient(-45deg, #facc15 0 12px, #1a1d29 12px 24px);
      opacity: 0.85;
    }

    /* 원형 프로필 placeholder */
    .avatar {
      width: 112px;
      height: 112px;
      margin: 24px auto 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 5px solid var(--card);
      background: linear-gradient(135deg, var(--chip), var(--chip-hover));
      color: var(--primary);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.3);
      transition: border-color 0.3s;
    }

    .name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .role {
      margin-top: 2px;
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
    }
    .role .dot { color: var(--muted); margin: 0 2px; }
    .bio {
      margin: 14px auto 0;
      max-width: 330px;
      font-size: 14.5px;
      color: var(--muted);
      word-break: keep-all;
    }

    /* 관심사 태그 */
    .tags {
      list-style: none;
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    .tags li {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--chip);
      border: 1px solid var(--line);
      font-size: 12.5px;
      font-weight: 600;
    }

    /* 연락처 */
    .contacts {
      list-style: none;
      margin: 24px 0 20px;
      display: grid;
      gap: 8px;
      text-align: left;
    }
    .contacts li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 4px 4px 0;
      border-radius: 12px;
      background: var(--chip);
      transition: background-color 0.2s;
    }
    .contacts li:hover { background: var(--chip-hover); }
    .contact {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      font-size: 14.5px;
    }
    .contact svg { color: var(--primary); }
    .contact span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .copy {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .copy:hover { color: var(--primary); border-color: var(--primary); }

    /* CTA */
    .save-btn {
      margin-top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border-radius: 14px;
      /* 3색 그라데이션을 2배 크기로 깔고, hover 때 위치를 옮겨 색이 바뀌게 함 */
      background: linear-gradient(135deg, var(--primary), var(--primary-2), var(--primary));
      background-size: 200% 100%;
      background-position: 0% 0;
      color: var(--primary-text);
      font-weight: 700;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background-position 0.4s ease;
    }
    .save-btn svg { width: 18px; height: 18px; }
    .save-btn:hover {
      transform: scale(1.04);
      background-position: 100% 0;
      box-shadow: var(--btn-hover-shadow);
    }
    .save-btn:active { transform: scale(0.98); }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }

    /* 토스트 */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--text);
      color: var(--card);
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 반응형 ===== */
    @media (max-width: 480px) {
      body { padding: 64px 16px 24px; justify-content: flex-start; }
      .card { padding: 0 20px 22px; border-radius: 20px; }
      .card-banner { margin: 0 -20px; height: 96px; }
      .avatar { width: 96px; height: 96px; margin-top: 20px; font-size: 26px; }
      .name { font-size: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
  <script>
    // 깜빡임 방지: 렌더링 전에 테마 적용
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크/라이트 모드 전환">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <main class="card">
    <div class="card-banner" aria-hidden="true">
      <!-- 안전 스트라이프 장식 -->
      <span class="stripe"></span>
    </div>

    <div class="avatar" role="img" aria-label="프로필 사진">
      <span>현주</span>
    </div>

    <header class="identity">
      <h1 class="name">김현주</h1>
      <p class="role">안전 관리자 <span class="dot">·</span> 해성기공</p>
      <p class="bio">5년차 건설업 안전관리자. 현장의 안전을 지키고, 반복되는 문서 업무를 자동화하는 데 관심이 많습니다.</p>
      <ul class="tags" aria-label="관심사">
        <li>🦺 건설안전</li>
        <li>⚙️ 문서자동화</li>
        <li>🏊 수영</li>
        <li>🏃 달리기</li>
      </ul>
    </header>

    <ul class="contacts">
      <li>
        <a href="mailto:hjkimshawn@hanmail.net" class="contact">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <span>hjkimshawn@hanmail.net</span>
        </a>
        <button class="copy" type="button" data-copy="hjkimshawn@hanmail.net" aria-label="이메일 복사">복사</button>
      </li>
      <li>
        <div class="contact">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>부산, 대한민국</span>
        </div>
      </li>
    </ul>

    <a class="save-btn" href="mailto:hjkimshawn@hanmail.net">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      연락하기
    </a>
  </main>

  <footer class="footer">© 2026 김현주 · 해성기공</footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // 다크/라이트 모드 토글
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');

    function currentTheme() {
      const set = root.getAttribute('data-theme');
      if (set) return set;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    toggle.addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });

    // 연락처 복사
    const toast = document.getElementById('toast');
    let toastTimer;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    document.querySelectorAll('.copy').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(btn.dataset.copy);
          showToast('복사되었습니다: ' + btn.dataset.copy);
        } catch (e) {
          showToast('복사에 실패했습니다');
        }
      });
    });
  </script>
</body>
</html>
